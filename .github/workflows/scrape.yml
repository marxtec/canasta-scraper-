name: Recoleccion diaria de precios

on:
  schedule:
    # VARIOS INTENTOS A PROPOSITO.
    #
    # GitHub NO garantiza que un workflow programado se ejecute: los encola y
    # puede descartarlos en horas de carga alta. Verificado en este repo el
    # 2026-09-20: el cron de las 13:00 UTC no disparo ni una sola vez.
    #
    # La hora en punto es la peor (todos programan ahi), asi que se usan
    # minutos impares. Y se intenta cuatro veces: el job se salta solo si los
    # datos de hoy ya estan en el repo, asi que los intentos extra no
    # recolectan dos veces. Es la unica forma de que un dia no se pierda por
    # un encolamiento de GitHub.
    - cron: "7 13 * * *"    # 08:07 Lima  <- intento principal
    - cron: "23 15 * * *"   # 10:23 Lima  <- red de seguridad
    - cron: "41 18 * * *"   # 13:41 Lima
    - cron: "13 22 * * *"   # 17:13 Lima  <- ultimo intento del dia
  workflow_dispatch:      # permite lanzarlo a mano desde la pestana Actions

# Evita que dos corridas se pisen si una se atrasa
concurrency:
  group: scrape-diario
  cancel-in-progress: false

jobs:
  # Decide si hay que recolectar. Con varios cron al dia, este guardia es lo
  # que evita recolectar dos veces: si los CSV de hoy ya estan en el repo, los
  # intentos posteriores no hacen nada.
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      recolectar: ${{ steps.check.outputs.recolectar }}
      fecha: ${{ steps.check.outputs.fecha }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          # Fecha de Lima (UTC-5), no la del runner
          FECHA=$(TZ=America/Lima date +%Y-%m-%d)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          # Se exige que esten TODAS las cadenas activas, no solo alguna:
          # si una corrida quedo a medias, el siguiente intento la completa.
          FALTAN=0
          for R in plaza_vea metro wong vivanda tottus; do
            if [ ! -f "data/daily/${FECHA}__${R}.csv" ]; then
              echo "falta: ${FECHA}__${R}.csv"
              FALTAN=1
            fi
          done
          if [ "$FALTAN" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "recolectar=si" >> "$GITHUB_OUTPUT"
            echo "::notice::Recolectando datos de $FECHA"
          else
            echo "recolectar=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Los datos de $FECHA ya estan completos. No se hace nada."
          fi

  # Una cadena por job, en paralelo. Secuencialmente son ~69 min medidos
  # (Tottus 25, Plaza Vea 18, el resto ~9 cada una) y el job entero quedaba
  # al borde del timeout. En paralelo ninguna pasa de ~30 min y, sobre todo,
  # una cadena caida deja de arrastrar a las otras cuatro.
  scrape:
    needs: decidir
    if: needs.decidir.outputs.recolectar == 'si'
    runs-on: ubuntu-latest
    # Tottus es el techo: ~25 min de catalogo + ~25 min de fichas de EAN.
    # El resto termina en menos de 20.
    timeout-minutes: 75
    strategy:
      fail-fast: false      # que Tottus falle no debe cancelar Plaza Vea
      matrix:
        retailer: [plaza_vea, metro, wong, vivanda, tottus]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar ${{ matrix.retailer }}
        run: python collect.py --retailer ${{ matrix.retailer }}

      - name: Guardar datos de ${{ matrix.retailer }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: datos-${{ matrix.retailer }}
          path: data/
          retention-days: 7
          if-no-files-found: error

  # Un solo job commitea. Cinco jobs empujando a la misma rama se pisan entre
  # si y el perdedor descarta su dia.
  commit:
    needs: [decidir, scrape]
    # Commitea lo que SI se recolecto, aunque falte una cadena. Se salta si no
    # habia nada que recolectar.
    if: always() && needs.decidir.outputs.recolectar == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Recuperar los datos de todas las cadenas
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artefactos

      - name: Juntar en data/
        run: |
          mkdir -p data/raw data/daily data/trees
          # Cada artefacto trae la misma estructura data/{raw,daily,trees} y,
          # en el caso de Tottus, la cache de EAN en la raiz de data/. La cache
          # DEBE volver al repo: si se pierde, cada corrida vuelve a pedir
          # miles de fichas de producto desde cero y nunca converge.
          find /tmp/artefactos -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            [ -d "$dir/raw" ]   && cp -v "$dir"/raw/*   data/raw/   2>/dev/null || true
            [ -d "$dir/daily" ] && cp -v "$dir"/daily/* data/daily/ 2>/dev/null || true
            [ -d "$dir/trees" ] && cp -v "$dir"/trees/* data/trees/ 2>/dev/null || true
            find "$dir" -maxdepth 1 -name '*.json' -exec cp -v {} data/ \; 2>/dev/null || true
          done
          echo "--- daily ---"; ls -la data/daily/
          echo "--- cache EAN ---"; ls -la data/*.json 2>/dev/null || echo "(sin cache todavia)"

      - name: Commitear datos del dia
        run: |
          git config user.name  "canasta-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "::warning::Sin datos nuevos. Ninguna cadena entrego filas."
            exit 0
          fi
          git commit -m "datos $(date -u +%Y-%m-%d)"
          # Rebase por si alguien empujo mientras corria la recoleccion:
          # sin esto el push falla y el dia se pierde sin posibilidad de
          # recuperarlo.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push fallido, reintento $intento"
            sleep 5
          done
          echo "::error::No se pudo empujar los datos del dia."
          exit 1

      - name: Avisar si alguna cadena fallo
        if: needs.scrape.result != 'success'
        run: |
          echo "::error::Al menos una cadena fallo hoy. Un dia perdido en esa
          cadena no se recupera: revisar el log del job correspondiente."
