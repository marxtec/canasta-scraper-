# Cadenas a scrapear.
#
# sales_channel: FIJARLO Y NO CAMBIARLO. En VTEX el precio varia segun el
#   canal/tienda seleccionada. Si cambia a mitad del panel, la serie tiene un
#   salto que no es inflacion. OJO: el canal valido NO es el mismo en todas
#   las cadenas; ver las notas de cada una.
#
# food_categories: ids raiz del arbol. Vacio = se detectan por nombre con
#   food_keywords, que es lo preferible: los ids cambian cuando la cadena
#   reordena su arbol, los nombres casi nunca. El scraper baja solo hasta las
#   hojas (la API de VTEX corta la paginacion ~2500 resultados por query, por
#   eso se consulta hoja por hoja y no la categoria entera).
#
# enabled: false = no se consulta.

retailers:
  # 343 hojas de alimentos. Verificado 2026-09-19.
  - name: plaza_vea
    base_url: https://www.plazavea.com.pe
    platform: vtex
    sales_channel: 1
    enabled: true
    food_categories: []

  # 266 hojas de alimentos. Verificado 2026-09-19.
  - name: metro
    base_url: https://www.metro.pe
    platform: vtex
    sales_channel: 1
    enabled: true
    food_categories: []

  # Wong usa el canal 70, no el 1. La cuenta rechaza sc=1 con 401 y sc=2
  # responde 200 pero con catalogo vacio, lo que hacia parecer que el canal
  # no se podia fijar. El valor correcto lo publica la propia tienda en
  # /api/segments -> "channel":"70". Verificado: sc=70 devuelve exactamente
  # los mismos productos y precios que omitir el parametro, en 6 de 6
  # categorias raiz probadas. Se fija explicitamente para no depender del
  # default de la cuenta. Verificado 2026-09-19.
  - name: wong
    base_url: https://www.wong.pe
    platform: vtex
    sales_channel: 70
    enabled: true
    food_categories: []

  # Vivanda NO es intermitente: www.vivanda.com.pe es un front Next.js que
  # devuelve HTML en TODA ruta /api/ (no expone el catalogo legacy). La cuenta
  # VTEX existe y responde en el host canonico de abajo, con arbol propio.
  # Canales probados: solo 1 y 3 activos, ambos con el mismo precio; se fija 1.
  # Verificado 2026-09-19.
  - name: vivanda
    base_url: https://vivanda.vtexcommercestable.com.br
    platform: vtex
    sales_channel: 1
    enabled: true
    food_categories: []

  # Tottus (Falabella) usa Catalyst, no VTEX. El menu de categorias se entrega
  # en __NEXT_DATA__ y el catalogo publico en /s/browse/v1/listing/pe.
  # El cliente falabella_catalyst pagina esa API sin navegador ni credenciales.
  # Verificado 2026-09-19.
  - name: tottus
    base_url: https://www.tottus.com.pe
    platform: falabella_catalyst
    sales_channel: null
    catalog_path: /tottus-pe
    # El listado de Catalyst no publica EAN; solo la ficha de cada producto
    # (okayToShopBarcodes). Se resuelve con cache persistente: ver canasta/eans.py
    ean_from_product_page: true
    enabled: true
    food_categories: []

  # Flora & Fauna: tecnicamente funciona (VTEX, sc=1, 198 hojas, 100% precio
  # y EAN) pero se EXCLUYE a proposito: es tienda organica/premium (hongos
  # deshidratados a S/29 los 100 g), no un supermercado de canasta basica.
  # Su surtido no es comparable con el de Metro o Plaza Vea y meterlo al
  # panel ensuciaria el indice. Se deja configurada y desactivada por si el
  # dia de manana interesa una serie del segmento premium.
  # Verificado y descartado 2026-09-20.
  - name: florayfauna
    base_url: https://www.florayfauna.pe
    platform: vtex
    sales_channel: 1
    enabled: false
    segmento: premium
    food_categories: []

  # ------------------------------------------------------------------
  # CADENAS SIN CATALOGO ONLINE -- verificado 2026-09-20, no reinvestigar
  #
  # Mass (tiendasmass.com.pe): sitio WordPress corporativo, SIN tienda
  #   online y SIN precios. www.mass.pe ni siquiera resuelve TLS. Es
  #   coherente con su modelo de descuento duro: no tienen e-commerce.
  #   La unica via serian los folletos de ofertas, que son imagenes.
  # Makro: tienda.makro.com.pe y www.makro.com.pe redirigen a un dominio
  #   parqueado (ww38.*). Su tienda online ya no existe.
  # Mayorsa (mayorsa.com.pe): WordPress con WP REST API activa pero SIN
  #   WooCommerce (namespaces: wp/v2, oembed, wordfence... ningun wc/*).
  #   Los pocos precios de la portada son un banner, no un catalogo.
  # Economax: el dominio no resuelve.
  # Tambo: no es VTEX, es app de delivery (redirige a /pedir).
  #
  # Conclusion: en Lima, las cadenas de descuento y mayoristas NO publican
  # precios online. El panel cubre el canal supermercado moderno, que es
  # justo donde SI hay dato. Esto es una limitacion del universo observable
  # y hay que declararla en el paper, no un fallo del scraper.
  # ------------------------------------------------------------------

# Deteccion de categorias de alimentos por nombre, en minusculas y sin tildes.
# Verificado contra los arboles de las 5 cadenas activas: 0 falsos positivos.
# Añadir una palabra aqui amplia la cobertura en TODAS las cadenas a la vez,
# que es justo lo que se quiere: la comparacion entre cadenas solo vale si
# ambas cubren las mismas categorias.
food_keywords:
  - abarrote
  - fruta
  - verdura
  - carne
  - ave
  - pescado
  - marisco
  - lacteo
  - huevo
  - panaderia
  - pasteleria
  - desayuno
  - congelado
  - queso
  - fiambre
  - embutido
  - bebida
  - agua
  - cerveza
  - vino
  - licor
  - pollo
  - rostizado
  - comida
  - plato          # Tottus: "Platos Preparados"
  - parrill        # Tottus: "Mundo Parrillero" (sufijo, no "parrilla")
  - saludable
  - organico
  - fresco
  - pack
  - dulce
  - galleta
  - snack
  - reposteria

# Categorias que el filtro por nombre atrapa pero NO son alimentos, o que son
# arboles internos de la cadena. Se comparan igual: minusculas y sin tildes.
excluded_keywords:
  - mascota
  - limpieza
  - belleza
  - cuidado personal

# Cortesia. No bajar de 0.5s sin una buena razon.
rate_limit_seconds: 1.5
page_size: 50
max_offset: 2450        # tope duro de VTEX; se corta antes para no recibir 500
max_pages: 100           # tope de seguridad para APIs paginadas no-VTEX
request_timeout: 60
max_retries: 4

# Fichas de producto que se consultan por corrida para resolver EAN (solo
# Tottus: las otras cuatro cadenas lo traen en el listado, gratis).
#
# No hay via masiva, verificado 2026-09-20: no existe endpoint bulk
# (/s/product/v1 da 503), el listado no acepta parametros para pedir mas
# campos, y el sitemap de fichas solo trae URLs y fechas, sin GTIN. Ficha
# por ficha es la unica forma.
#
# Este presupuesto es solo para la corrida DIARIA, que tiene que terminar
# rapido. El arranque NO se raciona: se resuelve de una pasada con el
# workflow "Relleno unico de EAN" (~3.3 h, cabe de sobra en el limite de 6 h
# de un job). Como el EAN es estatico, ese coste se paga UNA vez; despues el
# diario solo consulta los SKU nuevos, que son decenas.
#
# robots.txt de Tottus permite explicitamente las fichas de producto; solo
# bloquea /basket, /myaccount, /checkout y /orders. Verificado 2026-09-20.
ean_budget_per_run: 1500

# Ritmo para las fichas de EAN. Mas rapido que el del catalogo (1.5s) porque
# son paginas estaticas y sueltas, pero sigue siendo 1 peticion por segundo:
# menos que una persona navegando. No bajar de 1.0 sin una buena razon.
ean_rate_limit_seconds: 1.0
